name: macOS prototype

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
      - "assets/desktop-icon-billiards.png"
      - "LICENSE"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
      - "assets/desktop-icon-billiards.png"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the physics model
        run: swift test --package-path macos
      - name: Test desktop decoding and wallpaper geometry
        run: bash macos/check-desktop.sh
      - name: Test desktop entry and restoration with invisible fixtures
        run: bash macos/check-session.sh
      - name: Build a universal app
        run: bash macos/build.sh --universal
      - name: Upload the prototype
        uses: actions/upload-artifact@v4
        with:
          name: DesktopIconBilliards-macOS-prototype
          path: macos/dist/DesktopIconBilliards-*-macOS-universal.zip
          if-no-files-found: error
